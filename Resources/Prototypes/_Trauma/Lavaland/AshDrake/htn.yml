- type: megafaunaSelector
  id: AshDrake
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: AshDrakeActions

- type: megafaunaSelector
  id: AshDrakeActions
  selector: !type:GroupMegafaunaSelector
    children:
    - id: ActionAshDrakeFireCone
    - id: ActionAshDrakeFireMeteors

- type: megafaunaSelector
  id: ActionAshDrakeFireCone
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,4.0
      inverse: true
    actionId: ActionFireCone
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionFireCone

- type: megafaunaSelector
  id: ActionAshDrakeFireMeteors
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,4.0
      inverse: true
    actionId: ActionAshDrakeMeteors
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionAshDrakeMeteors
